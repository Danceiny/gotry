name: CI

# 全栈回归是唯一合并闸(§1-§49):typecheck + post-DSH 插件 smoke + 全部测试套件,Node 22/24 双版本。
# Node 26 先作为 build-dist 兼容闸:package.json engines 是开放上界,发布构建不能调用已移除的 Node API。
# 依赖来自公共 npm registry(lockfile 已全部 resolved 到 registry.npmjs.org)。
# 真 LLM 巡检(replay-real / time-eval --real)消耗真实 key,不进 CI,由维护者本地执行。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 会话面 live 嗅探需要 headful 浏览器 + 登录态,CI 一律关闭(降级断言仍覆盖)
  GOTRY_SESSION_LIVE: "0"

jobs:
  booking-copilot-release:
    name: Booking Copilot release contract
    runs-on: ubuntu-24.04
    container:
      # Pin the complete Node/npm/glibc build userspace. The source SHA alone
      # is not a byte identity if a mutable runner image changes underneath it.
      image: docker.io/library/node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned build userspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          test "$(npm --version)" = 11.19.0
          test "$(node -p 'process.versions.modules')" = 137
          test "$(node -p 'process.report.getReport().header.glibcVersionRuntime')" = 2.36
      - name: Booking Copilot release builder
        env:
          EXPECTED_GOTRY_ARTIFACT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_GOTRY_RELEASE_TUPLE: linux-x64-glibc
          EXPECTED_NODE_VERSION: v24.20.0
          EXPECTED_NPM_VERSION: 11.19.0
        run: node scripts/booking-copilot-release-builder-tests.mjs

  ci:
    name: typecheck + full regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ts/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ts dependencies
        # ts/package.json 精确钉住完整 alpha.3 peer closure；裸 npm ci 是
        # 合并闸，防止 lockfile 再次依赖 legacy peer 解析绕行。
        run: npm ci --no-audit --no-fund
        working-directory: ts

      - name: Build dist (§25 publish-preverify packs the real dist)
        run: node scripts/build-dist.mjs

      - name: Booking Copilot builder rejects non-Node24
        if: matrix.node-version == 22
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if EXPECTED_GOTRY_ARTIFACT_ID="$(git rev-parse HEAD)" \
             EXPECTED_GOTRY_RELEASE_TUPLE=linux-x64-glibc \
             EXPECTED_NODE_VERSION="$(node --version)" \
             EXPECTED_NPM_VERSION="$(npm --version)" \
             node scripts/build-booking-copilot-release.mjs "$RUNNER_TEMP/non-node24-release" 2>"$error_file"; then
            echo "Node22 unexpectedly built a Booking Copilot release" >&2
            exit 1
          fi
          grep -Fq "Node 24 is required" "$error_file"

      # Root npm ci now materializes the pinned DSH closure. Keep exercising the
      # publish shape from a clean consumer so package E2E cannot borrow source
      # files or node_modules from the developer tree.
      - name: Prepare packaged tool-budget E2E runtime
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir" >/dev/null
          tarballs=("$package_dir"/*.tgz)
          test "${#tarballs[@]}" -eq 1
          (cd "$install_dir" && npm init --yes >/dev/null)
          npx --yes pnpm@11.5.0 --dir "$install_dir" add --ignore-scripts "${tarballs[0]}"
          npx tsx ts/scripts/pnpm-dsh-closure-proof.ts "$install_dir"
          test -x "$install_dir/node_modules/.bin/gotry"
          echo "GOTRY_BUDGET_E2E_BIN=$install_dir/node_modules/.bin/gotry" >> "$GITHUB_ENV"
          echo "GOTRY_BRIDGE_E2E_BIN=$install_dir/node_modules/.bin/gotry" >> "$GITHUB_ENV"

      # agent-reach 不装:上游 wheel 不在公共 PyPI(内部分发),§15 wrapper 在未装时
      # 结构化 SKIP(真集成面设备绑定);有装的开发机仍跑全 7 断言

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ts

      - name: Post-DSH-upgrade plugin smoke
        run: npx tsx scripts/smoke.ts
        working-directory: ts

      - name: Full-stack regression (§1-§49)
        run: bash scripts/run-all-tests.sh

  dist-compatibility:
    name: Node ${{ matrix.node-version }} focused dist compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build dist
        run: node scripts/build-dist.mjs

      - name: Verify exact dist and ESM runtime compatibility
        run: node scripts/build-dist-compat-tests.mjs

  pnpm-dist-compatibility:
    name: Node 24 pnpm frozen-lock dist compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the root package-manager layout
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify direct compiler resolution and dist compatibility
        run: node scripts/build-dist-compat-tests.mjs
