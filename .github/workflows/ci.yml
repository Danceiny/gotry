name: CI

# 全栈回归是唯一合并闸(§1-§35):typecheck + 全部测试套件,Node 22/24 双版本。
# 依赖来自公共 npm registry(lockfile 已全部 resolved 到 registry.npmjs.org)。
# 真 LLM 巡检(replay-real / time-eval --real)消耗真实 key,不进 CI,由维护者本地执行。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 会话面 live 嗅探需要 headful 浏览器 + 登录态,CI 一律关闭(降级断言仍覆盖)
  GOTRY_SESSION_LIVE: "0"

jobs:
  ci:
    name: typecheck + full regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ts/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ts dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ts

      - name: Build dist (§25 publish-preverify packs the real dist)
        run: node scripts/build-dist.mjs

      # agent-reach 不装:上游 wheel 不在公共 PyPI(内部分发),§15 wrapper 在未装时
      # 结构化 SKIP(真集成面设备绑定);有装的开发机仍跑全 7 断言

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ts

      - name: Full-stack regression (§1-§34)
        run: bash scripts/run-all-tests.sh
