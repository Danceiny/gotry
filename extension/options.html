<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoTry Session Bridge 设置</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin: 16px 0 4px; font-size: 13px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 16px; padding: 8px 20px; font-size: 14px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
  #msg { margin-top: 12px; font-size: 13px; }
  .hint { font-size: 12px; color: #666; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>GoTry Session Bridge — 远程桥</h1>
  <p class="hint">
    缺省(留空)= 同机 loopback 模式(gotry 桌面形态)。<br>
    服务端形态(gotry-backend):填桥地址与令牌,扩展即成为该服务的浏览器端执行环境——
    检索在你自己的浏览器登录态里完成,服务器只做编排,零凭证经手。
  </p>
  <label for="baseUrl">桥地址(留空 = 同机模式)</label>
  <input id="baseUrl" placeholder="https://api.example.com/v1/session/bridge">
  <label for="token">令牌(Bearer)</label>
  <input id="token" type="password" placeholder="GOTRY_BACKEND_SESSION_API_KEY">
  <button id="save">保存</button>
  <button id="clear" style="background:#999">清除(回到同机模式)</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
