<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTry — 从出发到下一次出发</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:#0d1b2a;color:#e0e6ed;display:flex;height:100vh}
nav{width:220px;background:#081221;padding:20px 0;flex-shrink:0}
nav h1{font-size:22px;color:#4cc9f0;padding:0 20px 16px;letter-spacing:1px}
nav a{display:block;padding:10px 20px;color:#8d99ae;text-decoration:none;font-size:14px}
nav a.active,nav a:hover{color:#fff;background:#13273f}
main{flex:1;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:24px 40px}
.msg{max-width:72%;margin:12px 0;padding:14px 18px;border-radius:14px;line-height:1.65;font-size:14.5px;white-space:pre-wrap}
.msg.user{background:#1b4332;margin-left:auto;color:#d8f3dc}
.msg.bot{background:#1a2639;color:#e0e6ed}
.msg.bot .evidence{color:#4cc9f0;font-size:13px}
#input{display:flex;padding:16px 40px;background:#081221}
#input textarea{flex:1;background:#13273f;border:1px solid #2a3f5f;color:#fff;padding:12px;border-radius:10px;font-size:14.5px;resize:none;height:52px;font-family:inherit}
#input button{background:#4cc9f0;color:#081221;border:none;padding:0 26px;margin-left:12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
#input button:disabled{opacity:.4}
.tagline{font-size:11px;color:#3a5a7c;padding:0 20px;margin-top:8px}
#side{display:none;flex:1;padding:24px 40px;overflow-y:auto}
.card{background:#13273f;border-radius:12px;padding:16px;margin:10px 0}
.card h3{color:#4cc9f0;font-size:14px;margin-bottom:8px}
.card p{font-size:13px;color:#8d99ae;line-height:1.5}
</style>
</head>
<body>
<nav>
<h1>GoTry</h1>
<div class="tagline">身体和灵魂,更多旅行,更少旅游</div>
<a href="#" class="active" onclick="show('chat');return false">对话</a>
<a href="#" onclick="show('wish');loadState();return false">下一次出发</a>
<a href="#" onclick="show('profile');loadState();return false">动机画像</a>
</nav>
<main><div id="chat">
<div class="msg bot">你好,我是 GoTry。告诉我你想去哪、为什么想出发——我会先问清楚你的工作窗口和已订资源,再给你经引擎验证的方案。</div>
</div>
<div id="side"></div>
<div id="input">
<textarea id="q" placeholder="说说你的憧憬…(比如:下个月想带爸妈去云南待5天)" onKeyDown="if(event.key==='Enter'&&!event.shiftKey){send();return false}"></textarea>
<button onclick="send()" id="btn">出发</button>
</div>
</main>
<script>
const history=[];
async function send(){
const t=document.getElementById('q').value.trim();if(!t)return;
document.getElementById('btn').disabled=true;
addMsg(t,'user');document.getElementById('q').value='';
try{
const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history})});
const d=await r.json();
addMsg(d.reply,'bot');history.push({role:'user',text:t},{role:'assistant',text:d.reply});
}catch(e){addMsg('连接失败:'+e.message,'bot')}
document.getElementById('btn').disabled=false;
}
function addMsg(t,cls){
const c=document.getElementById('chat');
const d=document.createElement('div');d.className='msg '+cls;
d.innerHTML=t.replace(/</g,'&lt;').replace(/\[([^\]]+)\]/g,'<span class="evidence">[$1]</span>');
c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function show(p){
document.getElementById('chat').style.display=p==='chat'?'flex':'none';
document.getElementById(p==='chat'?'chat':'side').style.display=p==='chat'?'flex':'block';
document.getElementById('side').id='side';
document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
event.target.classList.add('active');
}
async function loadState(){
const s=document.getElementById('side');
s.innerHTML='<div class="card"><h3>加载中…</h3></div>';
try{
const r=await fetch('/state');const d=await r.json();
let h='';
(d.wishes||[]).forEach(w=>h+=`<div class="card"><h3>📍 ${w.name||''}</h3><p>${w.reason||''}</p><p>条件:${JSON.stringify(w.conditions||{})}</p></div>`);
if(!h)h='<div class="card"><h3>还没有憧憬入库</h3><p>对话中不可行的目的地会带着成行条件出现在这里</p></div>';
const p=d.profile||{};
h+=`<div class="card"><h3>🧭 动机画像</h3><p>工作窗口:${p.workWindow?p.workWindow.startMin/60+':00-'+p.workWindow.endMin/60+':00 UTC+'+p.workWindow.homeTzOffsetMin/60:'未提供'}</p><p>预算档:${p.budgetTier||'未定'}</p><p>同行人:${(p.companions||[]).join(', ')||'—'}</p><p>已订:${(p.bookedResources||[]).map(b=>b.ref).join('; ')||'—'}</p></div>`;
s.innerHTML=h;
}catch(e){s.innerHTML='<div class="card"><h3>加载失败</h3><p>'+e.message+'</p></div>'}
}
</script>
</body>
</html>
